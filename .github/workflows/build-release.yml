name: build-release

# Build a linux/arm64 Coder server binary from this fork, with Altana's patched
# preview/trivy pulled in via the go.mod replaces on this branch, and publish it
# as a GitHub release. Altana's Coder Terraform then installs it from this public
# release URL instead of a private registry. Modeled on altana-ai/skopeo-binary.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or tag to build (e.g. dynamic-params-closure-v2.35.4)."
        required: true
        type: string
      tag:
        description: "Release tag to publish (e.g. v2.35.4-param-closure)."
        required: true
        type: string
      force:
        description: "Rebuild and overwrite even if a release already exists for that tag."
        required: false
        type: boolean
        default: false

# The release step deletes and recreates a tag; never let two publishes race it.
concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-release:
    name: Build coder (linux/arm64) and release it
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload its assets
    steps:
      - name: Check out the ref to build
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Skip if a release already exists for the tag
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "A release for $TAG already exists."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Go
        if: steps.resolve.outputs.exists == 'false' || inputs.force
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Set up Node
        if: steps.resolve.outputs.exists == 'false' || inputs.force
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Install frontend dependencies
        if: steps.resolve.outputs.exists == 'false' || inputs.force
        working-directory: site
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile

      - name: Build the linux fat binaries (arm64 + amd64)
        if: steps.resolve.outputs.exists == 'false' || inputs.force
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          go mod download
          # Build directly with build_go.sh, not `make build/...`. The make target
          # depends on gen/mark-fresh, which rebuilds protoc-generated files
          # (site/e2e/provisionerGenerated.ts); protoc is not on the runner so make
          # fails. We only need the committed frontend + the fat server binary,
          # neither of which needs protoc.
          #
          # 1. Frontend app (vite). Consumes the committed typesGenerated.ts.
          (cd site && pnpm build)
          # 2. Client CLI binaries the server serves for CLI download / agent
          #    fetch. coderd extracts these at runtime from the embedded
          #    bin/coder.tar.zst (validated against bin/coder.sha1) — see
          #    site/bin.go — so we must reproduce exactly what `make` bakes into
          #    site/out/bin: slim per-platform binaries, sha1 checksum, then a
          #    zstd tar, then delete the raw binaries. Slim builds need no protoc.
          #    Must run AFTER pnpm build populates site/out.
          mkdir -p site/out/bin
          for t in linux:amd64 linux:arm64 darwin:amd64 darwin:arm64 windows:amd64; do
            os="${t%%:*}"; arch="${t##*:}"; ext=""
            [ "$os" = "windows" ] && ext=".exe"
            CODER_SLIM_BUILD=1 ./scripts/build_go.sh --slim --os "$os" --arch "$arch" \
              --version "$version" --output "site/out/bin/coder-${os}-${arch}${ext}"
          done
          ( cd site/out/bin
            openssl dgst -r -sha1 coder-* | tee coder.sha1
            tar cf coder.tar coder-*
            zstd -22 --ultra --force --long --no-progress -o coder.tar.zst coder.tar
            rm -f coder.tar coder-*
          )
          # 3. Fat server binaries. build_go.sh embeds site/out (frontend + client
          #    binaries) via -tags embed by default. Cross-compiled from amd64.
          mkdir -p out
          for arch in arm64 amd64; do
            ./scripts/build_go.sh --os linux --arch "$arch" \
              --version "$version" --output "out/coder_${TAG}_linux_${arch}"
            (cd out && sha256sum "coder_${TAG}_linux_${arch}" > "coder_${TAG}_linux_${arch}.sha256")
          done
          ls -la out

      - name: Write release notes
        if: steps.resolve.outputs.exists == 'false' || inputs.force
        run: |
          set -euo pipefail
          {
            echo "Altana build of the Coder server, linux/arm64."
            echo
            echo "Built from this fork at \`$GITHUB_SHA\` with go.mod replaces pinning Altana's"
            echo "patched coder/preview and coder/trivy (the dynamic-parameters preview"
            echo "performance change). The frontend is embedded; the asset is the upstream"
            echo "release shape (coder_<version>_linux_arm64.tar.gz)."
            echo
            echo "- Go: \`$(go version | awk '{print $3}')\`"
            echo "- Workflow: [run ${GITHUB_RUN_ID}](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
          } > notes.md
          cat notes.md

      - name: Publish release
        if: steps.resolve.outputs.exists == 'false' || inputs.force
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG: dynamic parameters render only the parameter closure" \
            --notes-file notes.md \
            "out/coder_${TAG}_linux_arm64" \
            "out/coder_${TAG}_linux_arm64.sha256" \
            "out/coder_${TAG}_linux_amd64" \
            "out/coder_${TAG}_linux_amd64.sha256"
