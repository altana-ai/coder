name: build-release

# Build a linux/arm64 Coder server binary from this fork, with Altana's patched
# preview/trivy pulled in via the go.mod replaces on this branch, and publish it
# as a GitHub release. Altana's Coder Terraform then installs it from this public
# release URL instead of a private registry. Modeled on altana-ai/skopeo-binary.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or tag to build (e.g. patch/altana-v2.35.7)."
        required: true
        type: string
      tag:
        description: "Release tag to publish, v<upstream version>-altana.<n> (e.g. v2.35.7-altana.1)."
        required: true
        type: string
      force:
        description: "Rebuild and overwrite even if a release already exists for that tag."
        required: false
        type: boolean
        default: false

# The release step deletes and recreates a tag; never let two publishes race it.
concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-release:
    name: Build coder (linux/arm64) and release it
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload its assets
    steps:
      - name: Check out the ref to build
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
          # Full history, so the release notes can list the patches since the upstream tag.
          fetch-depth: 0

      - name: Skip if a release already exists for the tag
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "A release for $TAG already exists."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Go
        if: steps.resolve.outputs.exists == 'false' || inputs.force
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Set up Node
        if: steps.resolve.outputs.exists == 'false' || inputs.force
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Install frontend dependencies
        if: steps.resolve.outputs.exists == 'false' || inputs.force
        working-directory: site
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile

      - name: Build the linux fat binaries (arm64 + amd64)
        if: steps.resolve.outputs.exists == 'false' || inputs.force
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          go mod download
          # Build directly with build_go.sh, not `make build/...`. The make target
          # depends on gen/mark-fresh, which rebuilds protoc-generated files
          # (site/e2e/provisionerGenerated.ts); protoc is not on the runner so make
          # fails. We only need the committed frontend + the fat server binary,
          # neither of which needs protoc.
          #
          # 1. Frontend app (vite). Consumes the committed typesGenerated.ts.
          (cd site && pnpm build)
          # 2. Client CLI binaries the server serves for CLI download / agent
          #    fetch. coderd extracts these at runtime from the embedded
          #    bin/coder.tar.zst (validated against bin/coder.sha1) — see
          #    site/bin.go — so we must reproduce exactly what `make` bakes into
          #    site/out/bin: per-platform binaries, sha1 checksum, then a zstd
          #    tar, then delete the raw files. Must run AFTER pnpm build
          #    populates site/out.
          #
          #    These are upstream's signed slim binaries for the base version,
          #    not ones we compile: the VS Code/Cursor extension verifies the
          #    CLI it downloads against Coder's release key, which a binary we
          #    build can never satisfy. Our patches are all server-side, so
          #    the client and agent need nothing from this fork. Each binary
          #    must verify against the pinned key or the build fails, and the
          #    .asc ships beside it so /bin/<name>.asc serves the signature.
          base="${version%%-*}"
          if ! [[ "$base" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Cannot derive an upstream x.y.z base version from tag '$TAG'" >&2
            exit 1
          fi
          key_fpr=21C96B1CB950718874F64DBD6A5A671B5E40A3B9
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -p "$GNUPGHOME" && chmod 700 "$GNUPGHOME"
          # The checkout is the patch ref, so read the key from the workflow's own commit.
          git fetch --no-tags --depth=1 "https://github.com/${GITHUB_REPOSITORY}.git" "$GITHUB_SHA"
          git show "${GITHUB_SHA}:.github/coder-release-signing-key.asc" > "$RUNNER_TEMP/coder-release-key.asc"
          gpg --batch --quiet --import "$RUNNER_TEMP/coder-release-key.asc"
          imported="$(gpg --batch --with-colons --fingerprint | awk -F: '$1 == "pub" { n++; want = 1; next } want && $1 == "fpr" { fpr = $10; want = 0 } END { if (n == 1) print fpr }')"
          if [ "$imported" != "$key_fpr" ]; then
            echo "Signing key fingerprint mismatch: got '$imported', want $key_fpr" >&2
            exit 1
          fi
          gpg --batch --export "$key_fpr" > "$RUNNER_TEMP/coder-release.gpg"
          mkdir -p site/out/bin out
          clients=(coder-linux-amd64 coder-linux-arm64 coder-linux-armv7
            coder-darwin-amd64 coder-darwin-arm64
            coder-windows-amd64.exe coder-windows-arm64.exe)
          for name in "${clients[@]}"; do
            url="https://releases.coder.com/coder-cli/${base}/${name}"
            curl -fsSL --retry 3 -o "site/out/bin/${name}" "$url"
            curl -fsSL --retry 3 -o "site/out/bin/${name}.asc" "${url}.asc"
            gpgv --keyring "$RUNNER_TEMP/coder-release.gpg" \
              "site/out/bin/${name}.asc" "site/out/bin/${name}"
          done
          ( cd site/out/bin
            sha256sum "${clients[@]}" > "$GITHUB_WORKSPACE/out/coder_${TAG}_client_sha256.txt"
            openssl dgst -r -sha1 coder-* | tee coder.sha1
            tar cf coder.tar coder-*
            zstd -22 --ultra --force --long --no-progress -o coder.tar.zst coder.tar
            rm -f coder.tar coder-*
          )
          # 3. Fat server binaries. build_go.sh embeds site/out (frontend + client
          #    binaries) via -tags embed by default. Cross-compiled from amd64.
          mkdir -p out
          for arch in arm64 amd64; do
            ./scripts/build_go.sh --os linux --arch "$arch" \
              --version "$version" --output "out/coder_${TAG}_linux_${arch}"
            (cd out && sha256sum "coder_${TAG}_linux_${arch}" > "coder_${TAG}_linux_${arch}.sha256")
          done
          ls -la out

      - name: Write release notes
        if: steps.resolve.outputs.exists == 'false' || inputs.force
        env:
          TAG: ${{ inputs.tag }}
          REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          base="${TAG#v}"
          base="v${base%%-*}"
          # The fork does not mirror upstream tags, so fetch the base tag to diff against.
          git fetch --no-tags https://github.com/coder/coder.git "refs/tags/${base}:refs/tags/${base}"
          {
            echo "Altana build of Coder ${base}, linux/arm64 and linux/amd64."
            echo
            echo "Built from \`${REF}\` at \`$(git rev-parse HEAD)\`. Patches on top of upstream ${base}:"
            echo
            git log --no-merges --reverse --format='- %s (%h)' "${base}..HEAD"
            echo
            echo "Client CLI and agent binaries served at /bin are upstream's signed ${base}"
            echo "release, verified against Coder's release key at build time; their sha256s are"
            echo "in \`coder_${TAG}_client_sha256.txt\`."
            echo
            echo "- Go: \`$(go version | awk '{print $3}')\`"
            echo "- Workflow: [run ${GITHUB_RUN_ID}](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
          } > notes.md
          cat notes.md

      - name: Publish release
        if: steps.resolve.outputs.exists == 'false' || inputs.force
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          fi
          # GITHUB_SHA is the release-ci commit the workflow runs from, not the ref that was built.
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$(git rev-parse HEAD)" \
            --title "$TAG" \
            --notes-file notes.md \
            "out/coder_${TAG}_linux_arm64" \
            "out/coder_${TAG}_linux_arm64.sha256" \
            "out/coder_${TAG}_linux_amd64" \
            "out/coder_${TAG}_linux_amd64.sha256" \
            "out/coder_${TAG}_client_sha256.txt"
